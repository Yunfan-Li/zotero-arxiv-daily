name: Test
on:
  workflow_dispatch:

jobs:
  calculate-and-send:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      #  with:
      #    repository: ${{ vars.REPOSITORY }}
      #    ref: ${{ vars.REF }}

      - name: Setup uv
        uses: astral-sh/setup-uv@v7.1.4


      - name: Run script
        env:
          CMAKE_BUILD_PARALLEL_LEVEL: "2"
          ZOTERO_ID: ${{ secrets.ZOTERO_ID }}
          ZOTERO_KEY: ${{ secrets.ZOTERO_KEY }}
          SENDER: ${{ secrets.SENDER }}
          RECEIVER: ${{ secrets.RECEIVER }}
          SENDER_PASSWORD: ${{ secrets.SENDER_PASSWORD }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_API_BASE: ${{ secrets.OPENAI_API_BASE }}
          SMTP_SERVER: ${{ secrets.SMTP_SERVER }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          ARXIV_QUERY: ${{ secrets.ARXIV_QUERY }}
          ZOTERO_IGNORE: ${{ vars.ZOTERO_IGNORE }}
          LANGUAGE: ${{ vars.LANGUAGE }}
          SEND_EMPTY: ${{ vars.SEND_EMPTY }}
          MAX_PAPER_NUM: ${{ secrets.MAX_PAPER_NUM || vars.MAX_PAPER_NUM }}
          USE_LLM_API: ${{ secrets.USE_LLM_API || vars.USE_LLM_API }}
          MODEL_NAME: ${{ secrets.MODEL_NAME || vars.MODEL_NAME }}
          CUSTOM_CONFIG: ${{ vars.CUSTOM_CONFIG }}
        run: |
          export DEBUG=true
          if [ -n "${CUSTOM_CONFIG//[[:space:]]/}" ]; then
            printf '%s\n' "$CUSTOM_CONFIG" > config/custom.yaml
          fi
          uv run --with 'llama-cpp-python==0.3.16' --with huggingface-hub src/zotero_arxiv_daily/main.py


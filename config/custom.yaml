# Legacy repository secrets remain the source of credentials and subscriptions.
# A nonempty CUSTOM_CONFIG workflow variable replaces this file completely.
legacy_env: true

zotero:
  user_id: ${oc.env:ZOTERO_ID}
  api_key: ${oc.env:ZOTERO_KEY}

email:
  sender: ${oc.env:SENDER}
  receiver: ${oc.env:RECEIVER}
  smtp_server: ${oc.env:SMTP_SERVER}
  smtp_port: ${oc.env:SMTP_PORT}
  sender_password: ${oc.env:SENDER_PASSWORD}

llm:
  api:
    key: ${oc.env:OPENAI_API_KEY,""}
    base_url: ${oc.env:OPENAI_API_BASE,""}
  generation_kwargs:
    model: ${oc.env:MODEL_NAME,gpt-4o-mini}

executor:
  source: ['arxiv']
